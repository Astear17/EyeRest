<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">EyeRest eye-clock app icon</title>
  <desc id="desc">A lime eye outline surrounds a clock iris with hands pointing to twelve and about four o'clock.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17211D"/>
      <stop offset="1" stop-color="#101719"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#C9FF70" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C9FF70" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="512" cy="512" r="390" fill="url(#glow)"/>
  <g fill="none" stroke="#C9FF70" stroke-width="61" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 134 512 Q 512 0 890 512 Q 512 1024 134 512"/>
    <circle cx="512" cy="512" r="178"/>
    <path d="M 512 512 L 512 397 M 512 512 L 608 576"/>
  </g>
</svg>
