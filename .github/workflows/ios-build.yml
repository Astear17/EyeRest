name: EyeRest iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'EyeRest/**'
      - 'EyeRest.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
      - 'Package.swift'
      - 'Tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'EyeRest/**'
      - 'EyeRest.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
      - 'Package.swift'
      - 'Tests/**'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic-tests:
    name: Run Foundation logic tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Expected Xcode 16.4 at $DEVELOPER_DIR, but it is unavailable." >&2
            echo "Installed Xcode applications:" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Run logic tests
        run: swift test

  build:
    name: Build unsigned iOS artifacts
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: node scripts/verify-repository.mjs

      - name: Prepare build paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          printf 'DERIVED_DATA=%s/EyeRestDerivedData\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Expected Xcode 16.4 at $DEVELOPER_DIR, but it is unavailable." >&2
            echo "Installed Xcode applications:" >&2
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Discover iOS project and shared scheme
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_path="$(find . -maxdepth 2 -type d -name '*.xcodeproj' -print -quit)"
          if [[ -z "$project_path" ]]; then
            echo "No .xcodeproj was found within two repository levels." >&2
            exit 1
          fi
          scheme="$(xcodebuild -list -project "$project_path" -json | python3 -c 'import json, sys; schemes = json.load(sys.stdin).get("project", {}).get("schemes", []); len(schemes) == 1 or sys.exit(f"Expected exactly one shared scheme, found: {schemes}"); print(schemes[0])')"
          printf 'project=%s\n' "$project_path" >> "$GITHUB_OUTPUT"
          printf 'scheme=%s\n' "$scheme" >> "$GITHUB_OUTPUT"
          echo "Building scheme: $scheme"

      - name: Build Release app for generic iOS devices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          set -o pipefail
          xcodebuild \
            -project "${{ steps.project.outputs.project }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build 2>&1 | tee "$ARTIFACT_DIR/xcodebuild.log"

      - name: Package unsigned artifacts and metadata
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No Release iOS app bundle was produced." >&2
            exit 1
          fi
          app_name="$(basename "$app_path")"
          product_name="${app_name%.app}"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          package_type="$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$app_path/Info.plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          bundle_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app_path/Info.plist")"
          info_dictionary_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleInfoDictionaryVersion' "$app_path/Info.plist")"
          if [[ "$executable" != "$product_name" ]]; then
            echo "Expected CFBundleExecutable '$product_name', found '$executable'." >&2
            exit 1
          fi
          if [[ "$package_type" != "APPL" ]]; then
            echo "Expected CFBundlePackageType 'APPL', found '$package_type'." >&2
            exit 1
          fi
          if [[ "$bundle_identifier" != "com.astear17.eyerest" || "$version" != "1.0" || "$build_number" != "1" ]]; then
            echo "Unexpected bundle metadata: identifier=$bundle_identifier version=$version build=$build_number" >&2
            exit 1
          fi
          if [[ -z "$bundle_name" || "$info_dictionary_version" != "6.0" ]]; then
            echo "Unexpected bundle identity metadata: name=$bundle_name infoDictionaryVersion=$info_dictionary_version" >&2
            exit 1
          fi
          if [[ ! -x "$app_path/$executable" ]]; then
            echo "Missing or non-executable app binary: $app_path/$executable" >&2
            exit 1
          fi
          test -d "$app_path/en.lproj"
          test -d "$app_path/vi.lproj"
          test -f "$app_path/en.lproj/Localizable.strings"
          test -f "$app_path/vi.lproj/Localizable.strings"
          printf 'Validated bundle metadata: identifier=%s version=%s build=%s executable=%s packageType=%s\n' "$bundle_identifier" "$version" "$build_number" "$executable" "$package_type"
          /usr/bin/plutil -convert xml1 -o "$ARTIFACT_DIR/${product_name}-Info.plist" "$app_path/Info.plist"
          (
            cd "$(dirname "$app_path")"
            /usr/bin/zip -qry "$ARTIFACT_DIR/${product_name}-unsigned.app.zip" "$app_name"
          )
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/$app_name"
          (
            cd "$package_dir"
            /usr/bin/zip -qry "$ARTIFACT_DIR/${product_name}-unsigned.ipa" Payload
          )
          unzip -t "$ARTIFACT_DIR/${product_name}-unsigned.ipa"
          python3 -c 'import json, sys; path, product, executable, package_type, version, build, bundle_id, sha = sys.argv[1:]; open(path, "w", encoding="utf-8").write(json.dumps({"product": product, "executable": executable, "packageType": package_type, "bundleIdentifier": bundle_id, "version": version, "buildNumber": build, "commit": sha, "configuration": "Release", "sdk": "iphoneos", "signing": "disabled", "infoPlist": f"{product}-Info.plist", "ipa": "unsigned; inspection-only and not installable on a normal iPhone"}, indent=2) + "\n")' "$ARTIFACT_DIR/build-metadata.json" "$product_name" "$executable" "$package_type" "$version" "$build_number" "$bundle_identifier" "$GITHUB_SHA"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyerest-ios-unsigned-${{ github.sha }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14
